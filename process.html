<!DOCTYPE html>
<html lang="en" class="page-process">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process — Ori Kurz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- עמוד התהליך: הפריים PROCESS מהפיגמה -->
  <main class="process-page">

    <!-- אזור העיצוב: 14x20 משבצות. קווי הגריד הם הרקע שלו -->
    <div class="process-grid grid-lines">

      <!-- מלבני מנטה שמאחדים משבצות (מסתירים את הקווים שבתוכם) -->
      <div class="grid-box merge-box merge-box--1"></div>
      <div class="grid-box merge-box merge-box--2"></div>
      <div class="grid-box merge-box merge-box--3"></div>
      <div class="grid-box merge-box merge-box--4"></div>
      <div class="grid-box merge-box merge-box--5"></div>
      <div class="grid-box merge-box merge-box--6"></div>

      <!-- תוויות טקסט -->
      <p class="on-grid process-label process-label--date-1">#19/10/2026</p>
      <p class="on-grid process-label process-label--coming-soon">#Coming Soon page</p>

      <!-- כפתור HOME: אותה קומפוננטה Button כמו בעמוד הבית -->
      <a class="grid-box nav-button process-home-button" href="index.html" data-en="HOME" data-he="בית" data-ar="الرئيسية"><span class="nav-button-label">HOME</span></a>

      <p class="on-grid process-label process-label--direction-one">#Two initial directions – Direction one</p>
      <p class="on-grid process-label process-label--direction-two">#Two initial directions –  Direction two</p>
      <p class="on-grid process-label process-label--date-2">#26/10/2026</p>

      <h1 class="on-grid process-heading">Process</h1>

      <!-- 19/10: עמוד ה-Coming soon -->
      <img class="on-grid shot shot--coming-soon" src="Images/process/coming-soon-page.png" alt="The Coming Soon page">

      <!-- 26/10: כיוון ראשון. שלוש התמונות הראשונות חתוכות מאותו צילום מסך -->
      <div class="on-grid shot shot-crop shot--board">
        <img src="Images/process/direction-one-board.png" alt="Direction one: moodboard">
      </div>
      <div class="on-grid shot shot-crop shot--green">
        <img src="Images/process/direction-one-board.png" alt="Direction one: green portfolio cover">
      </div>
      <div class="on-grid shot shot-crop shot--blue">
        <img src="Images/process/direction-one-board.png" alt="Direction one: blue portfolio cover">
      </div>
      <img class="on-grid shot shot--align-bottom shot--pink" src="Images/process/direction-one-pink.png" alt="Direction one: pink portfolio cover">

      <!-- כיוון שני -->
      <img class="on-grid shot shot--moodboard" src="Images/process/direction-two-moodboard.png" alt="Direction two: moodboard">
      <img class="on-grid shot shot--align-top shot--option-3" src="Images/process/direction-two-option-3.png" alt="Direction two: option 3">
      <img class="on-grid shot shot--option-2" src="Images/process/direction-two-option-2.png" alt="Direction two: option 2">
      <img class="on-grid shot shot--option-1" src="Images/process/direction-two-option-1.png" alt="Direction two: option 1">
      <img class="on-grid shot shot--option-4" src="Images/process/direction-two-option-4.png" alt="Direction two: option 4">

      <!-- עיגולים צבעוניים (קישוט) -->
      <img class="on-grid circle circle--1" src="Images/process/circle-pink.svg" alt="">
      <img class="on-grid circle circle--2" src="Images/process/circle-pink.svg" alt="">
      <img class="on-grid circle circle--3" src="Images/process/circle-green.svg" alt="">
      <img class="on-grid circle circle--4" src="Images/process/circle-green.svg" alt="">
      <img class="on-grid circle circle--5" src="Images/process/circle-green.svg" alt="">
      <img class="on-grid circle circle--6" src="Images/process/circle-yellow.svg" alt="">
      <img class="on-grid circle circle--7" src="Images/process/circle-yellow.svg" alt="">
      <img class="on-grid circle circle--8" src="Images/process/circle-yellow.svg" alt="">
      <img class="on-grid circle circle--9" src="Images/process/circle-orange.svg" alt="">
      <img class="on-grid circle circle--10" src="Images/process/circle-orange.svg" alt="">
      <img class="on-grid circle circle--11" src="Images/process/circle-orange.svg" alt="">
      <img class="on-grid circle circle--12" src="Images/process/circle-orange.svg" alt="">
      <img class="on-grid circle circle--13" src="Images/process/circle-blue.svg" alt="">
      <img class="on-grid circle circle--14" src="Images/process/circle-blue.svg" alt="">

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
