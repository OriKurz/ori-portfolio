<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ori Kurz — Portfolio</title>

  <!-- פונט Bebas Neue (לשורת השם למטה) מ-Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- המסגרת האדומה עם הפינות המעוגלות -->
  <main class="frame">
    <div class="frame-inner">

      <!-- הכותרת הגדולה -->
      <h1 class="coming-soon">
        <span class="coming-soon-line">Coming</span>
        <span class="coming-soon-line coming-soon-line--indent">Sooon...</span>
      </h1>

      <!-- השם בתחתית: "#" בפונט Pilowlava נראה כמו כוכבית -->
      <p class="signature">
        <span class="signature-word">ori kurz</span>
        <span class="signature-mark">#</span>
        <span class="signature-word">PORTFOLIO</span>
      </p>

    </div>
  </main>

</body>
</html>
