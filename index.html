<!DOCTYPE html>
<html lang="en" class="page-home">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ori Kurz — Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <!-- מעבר בין עמודים: נטען ב-head כדי לכסות את העמוד החדש מהציור הראשון -->
  <script src="page-transition.js"></script>
  <!-- גודל הגריד לפי החלון: נטען לפני שהעמוד מצויר -->
  <script src="grid.js"></script>
</head>
<body class="grid-lines">

  <!-- עמוד הבית: הפריים HOME מהפיגמה.
       קווי הגריד מצוירים ב-CSS על כל החלון (ברקע של body),
       ואזור העיצוב (15x9 משבצות) ממורכז מעליהם -->
  <main class="home">

    <!-- הכפתור שמפנה את הכדורים לשוליים (PEEK) ומחזיר אותם (PLAY). תמיד מעל הכדורים -->
    <button class="on-grid balls-toggle text-button-strong" type="button"><span class="balls-toggle-label">PEEK</span></button>

    <!-- "HI, IM" על מלבן כחול שמסתיר את הקו שבאמצע -->
    <div class="grid-box greeting-box">
      <p class="greeting text-button">HI, IM</p>
    </div>

    <!-- הפולרויד, מסובב כמו בפיגמה.
         הוא מופיע אחרי HI, IM כדי שיהיה מעליו, ולפני הכותרת כדי שיהיה מתחתיה -->
    <img class="photo" src="Images/ME.png" alt="Ori Kurz as a child, lying in the snow">

    <h1 class="title text-display-large">ORI KURZ</h1>

    <!-- כפתורי הניווט (האתר כרגע באנגלית בלבד) -->
    <!-- INDEX מוביל לעמוד אינדקס הפרויקטים (projects.html), PROCESS לעמוד התהליך, ו-SAY HI לעמוד Say Hi -->
    <nav>
      <a class="grid-box nav-button text-button nav-button--index" href="projects.html"><span class="nav-button-label">INDEX</span></a>
      <!-- במחשב PROCESS תופס משבצת אחת ונשבר לשתי שורות (PRO / CESS), כמו בפיגמה -->
      <a class="grid-box nav-button text-button nav-button--process" href="process.html" aria-label="PROCESS"><span class="nav-button-label">PRO<br class="process-line-break">CESS</span></a>
      <a class="grid-box nav-button text-button nav-button--say-hi" href="say-hi.html"><span class="nav-button-label">SAY HI:)</span></a>
    </nav>

  </main>

  <!-- בריכת הכדורים: מצוירת על קנבס שמכסה את כל החלון (ball-pit.js) -->
  <canvas class="ball-pit" aria-hidden="true"></canvas>
  <span class="ball-size-probe" aria-hidden="true"></span>

  <!-- ball-pit.js נטען ראשון, כי script.js בודק דרכו אם יש כדור מעל התמונה -->
  <script src="ball-pit.js"></script>
  <script src="script.js"></script>
  <script src="keyboard-nav.js"></script>
  <script src="cursor.js"></script>
</body>
</html>
