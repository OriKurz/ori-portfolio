<!DOCTYPE html>
<html lang="en" class="page-home">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ori Kurz — Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="grid-lines">

  <!-- עמוד הבית: הפריים HOME מהפיגמה.
       קווי הגריד מצוירים ב-CSS על כל החלון (ברקע של body),
       ואזור העיצוב (15x9 משבצות) ממורכז מעליהם -->
  <main class="home">

    <!-- הכפתור שמפנה את הכדורים לשוליים (PEEK) ומחזיר אותם (PLAY). תמיד מעל הכדורים -->
    <button class="on-grid balls-toggle" type="button">PEEK</button>

    <!-- "ORI KURZ" על מלבן כחול שמסתיר את הקו שבאמצע -->
    <div class="grid-box name-box">
      <p class="name">ORI KURZ</p>
    </div>

    <div class="grid-box year-box">
      <p class="year">2026</p>
    </div>

    <!-- הפולרויד, מסובב כמו בפיגמה.
         הוא מופיע אחרי ORI KURZ ו-2026 כדי שיהיה מעליהם, ולפני הכותרת כדי שיהיה מתחתיה -->
    <img class="photo" src="Images/ME.png" alt="Ori Kurz as a child, lying in the snow">

    <h1 class="title">portfolio</h1>

    <!-- כפתורי הניווט. המילים בכל שפה שמורות ב-data-en / data-he / data-ar -->
    <!-- הקישורים זמניים (#) עד שיהיו עמודים. WORK מוביל ל-The Perfect Crime, ו-PROCESS לעמוד התהליך -->
    <nav>
      <a class="grid-box nav-button nav-button--home" href="#" data-en="HOME" data-he="בית" data-ar="الرئيسية"><span class="nav-button-label">HOME</span></a>
      <a class="grid-box nav-button nav-button--works" href="the-perfect-crime.html" data-en="WORK" data-he="פרויקטים" data-ar="مشاريع"><span class="nav-button-label">WORK</span></a>
      <a class="grid-box nav-button nav-button--about" href="#" data-en="ABOUT" data-he="עליי" data-ar="عنّي"><span class="nav-button-label">ABOUT</span></a>
      <a class="grid-box nav-button nav-button--contact" href="#" data-en="CONTACT" data-he="צרו איתי קשר" data-ar="تواصل معي"><span class="nav-button-label">CONTACT</span></a>
      <a class="grid-box nav-button nav-button--process" href="process.html" data-en="PROCESS" data-he="תהליך" data-ar="مراحل العمل"><span class="nav-button-label">PROCESS</span></a>
    </nav>

  </main>

  <!-- בריכת הכדורים: מצוירת על קנבס שמכסה את כל החלון (ball-pit.js) -->
  <canvas class="ball-pit" aria-hidden="true"></canvas>
  <span class="ball-size-probe" aria-hidden="true"></span>

  <!-- ball-pit.js נטען ראשון, כי script.js בודק דרכו אם יש כדור מעל התמונה -->
  <script src="ball-pit.js"></script>
  <script src="script.js"></script>
</body>
</html>
