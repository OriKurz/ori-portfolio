<!DOCTYPE html>
<html lang="en" class="page-say-hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Say Hi — Ori Kurz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="grid-lines">
  <!-- בר הבחירה (התפריט): סגור בטעינה. ההמבורגר פותח אותו, והוא מחליק פנימה מלמעלה (script.js) -->
  <nav class="nav-bar" id="nav-bar" aria-label="Main">
    <!-- ההמבורגר של הבר: סוגר אותו -->
    <button class="menu-button nav-bar-menu" type="button" aria-label="Close menu" aria-controls="nav-bar">
      <span class="menu-button-line"></span>
      <span class="menu-button-line"></span>
      <span class="menu-button-line"></span>
    </button>
    <!-- INDEX ו-ABOUT עוד לא מובילים לשום מקום -->
    <ul class="nav-bar-list">
      <li><button class="nav-bar-link text-button" type="button">INDEX</button></li>
      <li><a class="nav-bar-link text-button" href="the-perfect-crime-project.html">WORK</a></li>
      <li><button class="nav-bar-link text-button" type="button">ABOUT</button></li>
      <li><a class="nav-bar-link text-button" href="say-hi.html" aria-current="page">SAY HI :)</a></li>
      <li><a class="nav-bar-link text-button" href="index.html">HOME</a></li>
    </ul>
  </nav>

  <!-- עמוד יצירת קשר: הפריים say-hi מהפיגמה (1440x810).
       קווי הגריד מצוירים ב-CSS על כל החלון (ברקע של body),
       ואזור העיצוב ממורכז מעליהם -->
  <main class="say-hi-page">

    <div class="say-hi-grid">

      <!-- ההמבורגר: קישור זמני לעמוד הבית, עד שיהיה תפריט -->
      <button class="on-grid menu-button" type="button" aria-label="Menu" aria-controls="nav-bar" aria-expanded="false">
        <span class="menu-button-line"></span>
        <span class="menu-button-line"></span>
        <span class="menu-button-line"></span>
      </button>

      <!-- שני מלבנים ורודים שמסתירים את הקווים שמאחורי הטקסט הקטן -->
      <div class="grid-box say-hi-box say-hi-box--top">
        <p class="say-hi-text text-tagline">COFFEE? A PROJECT? BOTH?</p>
      </div>

      <div class="grid-box say-hi-box say-hi-box--bottom">
        <p class="say-hi-text text-tagline">AND LET’S WORK TOGETHER</p>
      </div>

      <h1 class="say-hi-title text-display-medium">Say  hi</h1>
    </div>
  </main>

  <!-- כדורי יצירת הקשר: מסתובבים בחלון כל הזמן (script.js).
       כל כדור הוא כפתור. כדי לחבר לו קישור בעתיד, מחליפים את <button type="button">
       ב-<a href="..."> (למשל mailto: למייל), ומשאירים את אותה מחלקה -->
  <div class="contact-balls">
    <button class="contact-ball text-contact-ball contact-ball--instagram" type="button" aria-label="Instagram"><span>INSTA<br>GRAM</span></button>
    <button class="contact-ball text-contact-ball contact-ball--email" type="button" aria-label="E-mail"><span>E-MAIL</span></button>
    <button class="contact-ball text-contact-ball contact-ball--whatsapp" type="button" aria-label="WhatsApp"><span>WHATS<br>APP</span></button>
  </div>

  <script src="script.js"></script>
</body>
</html>
