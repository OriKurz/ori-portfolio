<!DOCTYPE html>
<html lang="en" class="page-project">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Perfect Crime — Ori Kurz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="grid-lines">

  <!-- עמוד מבואה לפרויקט: הפריים "גלריית עבודות הפשע המושלם" מהפיגמה.
       קווי הגריד מצוירים ב-CSS על כל החלון (ברקע של body),
       ואזור העיצוב (1440x810 בפיגמה) ממורכז מעליהם -->
  <main class="project-page">

    <div class="project-grid">

      <!-- ----- הסרגל העליון ----- -->
      <!-- ההמבורגר: קישור זמני לעמוד הבית, עד שיהיה תפריט -->
      <a class="on-grid menu-button" href="index.html" aria-label="Menu">
        <span class="menu-button-line"></span>
        <span class="menu-button-line"></span>
        <span class="menu-button-line"></span>
      </a>

      <!-- Index: עוד לא מחובר לשום מקום -->
      <button class="on-grid pill index-button" type="button">Index</button>

      <!-- ----- בר האינדקס: כל כדור הוא פרויקט -----
           בכל רגע רק כדור אחד פתוח ומורחב לפס עם שם הפרויקט (script.js).
           ברירת המחדל: The Perfect Crime (data-default).
           כדור בלי פרויקט (span) נשאר כדור רגיל. הלחיצה עוד לא מובילה לשום מקום -->
      <div class="on-grid index-bar">
        <button class="index-ball index-ball--pink" type="button" data-default><span class="index-ball-label">The Perfect Crime</span></button>
        <button class="index-ball index-ball--blue" type="button"><span class="index-ball-label">Leftovers*</span></button>
        <button class="index-ball index-ball--orange" type="button"><span class="index-ball-label">Touch Grass</span></button>
        <span class="index-ball index-ball--green" aria-hidden="true"></span>
        <span class="index-ball index-ball--pink" aria-hidden="true"></span>
        <span class="index-ball index-ball--blue" aria-hidden="true"></span>
        <span class="index-ball index-ball--orange" aria-hidden="true"></span>
        <span class="index-ball index-ball--green" aria-hidden="true"></span>
      </div>

      <!-- ----- הדימוי המרכזי: סרטון בלופ, בלי סאונד ובלי כפתורים ----- -->
      <div class="grid-box project-media">
        <video class="project-video" src="video/logo%20tpc.mp4" autoplay muted loop playsinline preload="auto"
          disablepictureinpicture disableremoteplayback aria-label="The Perfect Crime logo animation"></video>
      </div>

      <!-- ----- המלבן עם הטקסט על הפרויקט, מתחת לסרטון (באנגלית בלבד) ----- -->
      <div class="grid-box project-text-box">
        <div class="project-text" lang="en" dir="ltr">
          <p>What happens when a line worker at a packaging factory plans the perfect crime down to the smallest detail?</p>
        </div>

        <!-- הכפתור לעמוד הפרויקט המלא -->
        <a class="pill full-project-button" href="the-perfect-crime-project.html"><span>View full project</span></a>
      </div>

      <!-- ----- שם הפרויקט בשלוש שפות, במשבצות צמודות לדימוי המרכזי -----
           כרגע הם רק תצוגה, ולא מחליפים את שפת הטקסט (האתר באנגלית בלבד) -->
      <div class="grid-box project-name project-name--en" lang="en" dir="ltr"><span>The<br>Perfect<br>Crime</span></div>
      <div class="grid-box project-name project-name--he" lang="he" dir="rtl"><span>הפשע<br>המושלם</span></div>
      <div class="grid-box project-name project-name--ar" lang="ar" dir="rtl"><span>الجريمة<br>الكاملة</span></div>

      <!-- עיגול "Motion Graphic" (על הקצה של הסרטון). אותו עיגול ירוק כמו בעמוד התהליך.
           הוא אחרון ב-HTML כדי שיהיה מעל הסרטון ומעל ריבועי השם -->
      <div class="on-grid project-tag">
        <img class="project-tag-circle" src="Images/process/circle-green.svg" alt="">
        <p class="project-tag-text">Motion<br>Graphic</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
